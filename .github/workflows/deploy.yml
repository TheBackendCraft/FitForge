name: Deploy FitForge to GitHub Pages

on:
  push:
    branches:
      - main  # जब भी आप main ब्रांच पर पुश करेंगे, यह ट्रिगर होगा

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps: deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'  # आपकी Static HTML फाइल्स रूट पर ही हैं

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
